<!doctype html>
<html>
<head>
<style>
body{text-align:center}
input,select{font-size:1.5em;width:150px}
#n{text-align:right}
#o{margin-top:10px;font-size:1.5em}
</style>
</head>
<body>
<h1>No Interest Calculator</h1>
<form onsubmit="calc();return false">
$<input id="n" inputmode="decimal" pattern="[0-9]*\.?[0-9]*" required>
<select id="t">
<option>1 month</option>
<option>3 months</option>
<option>6 months</option>
<option>12 months</option>
<option>24 months</option>
<option>36 months</option>
<option>48 months</option>
<option>60 months</option>
</select>
<button>Go</button>
</form>
<div id="o"></div>

<script>
function calc(){
 let v=n.value.replace(/[^0-9.]/g,'');
 let x=Number(v);
 if(!isFinite(x))return;
 o.textContent='$'+x.toFixed(2);
}
</script>
</body>
</html>
