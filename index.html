<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>No Interest Calculator</title>

    <style>
        body {
            text-align: center;
        }

        #fields {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        #n {
            font-size: 1.5em;
            text-align: right;
            width: 150px;
        }

        #c {
            font-size: 1.5em;
            width: 70px;
        }

        #l {
            font-size: 1.5em;
            text-align: right;
            width: 80px;
        }

        #t {
            font-size: 1.5em;
            width: 110px;
        }

        #o {
            margin-top: 10px;
            font-size: 1.5em;
        }
    </style>
</head>

<body>

    <h1>No Interest Calculator</h1>

    <form onsubmit="calc(); return false">

        <div id="fields">

        <select id="c">
            <option value="$">USD< </option>
            <option value="€">EUR< </option>
            <option value="£">GBP< </option>
            <option value="¥">JPY< </option>
            <option value="₹">INR< </option>
            <option value="₽">RUB< </option>
            <option value="₩">KRW< </option>
            <option value="₿">BTC< </option>
        </select>
            
            <input
                id="n"
                inputmode="decimal"
                placeholder="Amount"
            >



            <input
                id="l"
                type="number"
                inputmode="numeric"
                placeholder="Term"
                title="Enter a positive number"
            >

            <select id="t">
                <option>Hours</option>
                <option>Days</option>
                <option>Months</option>
                <option>Years</option>
            </select>

        </div>

        <p>
            <button>Go</button>
        </p>

        <div id="o"></div>

    </form>

    <script>
        function calc() {
            let value = n.value.replace(/[^0-9.]/g, '');
            let number = Number(value);
            let term = Number(l.value);

            if (!isFinite(number)) {
                o.textContent = 'Please enter a valid amount.';
                return;
            }

            if (!isFinite(term) || term <= 0) {
                o.textContent = 'Term must be a positive whole number.';
                return;
            }

            o.textContent = c.value + number.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }
    </script>

</body>
</html>
